name: legacy-odoo-sandbox

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/generate-secrets.sh first}
    volumes:
      - legacy-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  odoo:
    image: odoo:17.0
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${POSTGRES_PASSWORD:?Run ./scripts/generate-secrets.sh first}
    command: ["odoo", "--config=/etc/odoo/odoo.conf"]
    ports:
      - "8069:8069"
      - "8077:8069"
    volumes:
      - ./config:/etc/odoo:ro
      - ./custom_addons:/mnt/extra-addons:ro
      - ./addons:/mnt/legacy-addons:ro
      - ./third_party_addons:/mnt/third-party-addons:ro
      - ./private_addons:/mnt/private-addons:ro
      - legacy-odoo-data:/var/lib/odoo
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8069/web/login', timeout=5)"
      interval: 10s
      timeout: 6s
      retries: 30
      start_period: 30s

volumes:
  legacy-db-data:
  legacy-odoo-data:
